    <script>
      // Self-Healing Cache Buster: Tự động dọn dẹp cache cũ nếu phát hiện lỗi nạp file sau khi deploy mới
      window.addEventListener('error', function(event) {
        var target = event.target || event.srcElement;
        var isScriptOrLink = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        if (isScriptOrLink) {
          if ('caches' in window && !sessionStorage.getItem('bep_auto_healed')) {
            sessionStorage.setItem('bep_auto_healed', '1');
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var r of regs) r.unregister();
                });
              }
              window.location.reload();
            });
          }
        }
      }, true);
    </script>
